name: Update projects

on:
  schedule:
    - cron: "30 6 * * *"   # daily, 06:30 UTC (after the blog job)
  push:
    branches: [main]
    paths: ["scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  update-readme:
    name: Regenerate project posters and rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the generator
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Generate
        run: python scripts/profile_projects.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git add -A README.md assets/projects
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh projects"
          git push
